<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Dictionary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Dictionary</h1>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Type a word..."
          autocomplete="off"
          autofocus
        >
        <button id="clearBtn" class="hidden">×</button>
      </div>
    </header>

    <main id="results">
      <div class="empty-state">
        <p>Start typing to search definitions</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
